<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real Time Validation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>REAL TIME VALIDATION USING JS</h1>
    <hr>

    <div class="login-container">
        <form onsubmit="validate(event)">
            <div class="input-row">
                <label>Email:</label>
                <input type="text" id="email">
            </div>
            
            <div class="input-row">
                <label>Password:</label>
                <input type="password" id="password" minlength="8">
            </div>
            
            <div class="input-row">
                <label>Age:</label>
                <input type="text" id="age" min="12" max="50">
            </div>

            <button type="submit">Login</button>
        </form>
    </div>

    <p id="message"></p>

    <script src="script.js"></script>
</body>
</html>
