<!DOCTYPE html>
<html>
<body>

    <h2>JavaScript Array Methods</h2>
    <h2>join() and pop()</h2>

    <p>The join() method joins array elements into a string and
    the pop() method removes the last element from an array.</p>

    <p id="myjoin"></p>
    <p id="myfirstpop"></p>
    <p id="mysecondpop"></p>

    <script>
        var fruits = ["Banana", "Orange", "Apple", "Mango"];
        
        // join() adds all elements into a string separated by " * "
        document.getElementById("myjoin").innerHTML = fruits.join(" * ");

        // Displays the full array first
        document.getElementById("myfirstpop").innerHTML = fruits;

        // pop() removes "Mango" from the end of the array
        fruits.pop();

        // Displays the array after the last element is removed
        document.getElementById("mysecondpop").innerHTML = fruits;
    </script>

</body>
</html>
