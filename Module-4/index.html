<!DOCTYPE html>
<html>
<head>
</head>
<body>
    <button onclick="myfunction(5)">Execute JS function</button>

    <script>
        function myfunction(x, y) {
            // Check if the second argument (y) was provided
            if (y === undefined) {
                y = 2; // Default value if undefined
            }
            document.write(x * y);
        }
    </script>
</body>
</html>
