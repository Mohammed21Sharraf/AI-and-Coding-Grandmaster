<!DOCTYPE html>
<html>
  <head>
    <title>HTML lists</title>
  </head>

  <body>
    <center>
      <h1>Using Iframe you can show any online video in your project</h1>

      <iframe 
        width="500" 
        height="400" 
        src="https://www.youtube.com/embed/SEHvTcoSMYA?autoplay=1&mute=0" 
        frameborder="0"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    </center>
  </body>
</html>
