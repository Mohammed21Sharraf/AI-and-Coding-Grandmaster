<!DOCTYPE html> <!-- What is Document Type -->
<html>
  <head>
    <!-- title of a webpage -->
    <title>Headings & Paragraphs</title>
    
  </head>
	
  <body>
    <h1>I am Codi</h1>
    I am <em>4 years old.</em><br>
    My Address is HSR Layout, Bengaluru.<br>
    My favourite subjects are <b>Physics</b> and <strong>Maths.</strong><br>
    My hobbies include Coding and solving problems.<br>
    My favourite quotation is - <br>
    <mark><q>Coding is fun.</q></mark>
  </body>
	
</html>
